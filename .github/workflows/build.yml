      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          
          mkdir -p out
          make O=out mrproper
          make O=out gki_defconfig
          
          # KCFLAGS is the environment variable that passes extra flags to the compiler.
          # We are disabling strict error checking (-Wno-error) 
          # and specific legacy code warnings that are causing your build to halt.
          export KCFLAGS="-Wno-error -Wno-int-conversion -Wno-implicit-function-declaration"
          
          # Build with the flags applied
          make O=out KCFLAGS="$KCFLAGS" -j1

name: Kernel Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          # Added clang and lld to the install list
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev clang lld llvm
      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          
          mkdir -p out
          
          make O=out gki_defconfig
          make O=out -j$(nproc)

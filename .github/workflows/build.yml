      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          
          mkdir -p out
          make O=out mrproper
          make O=out gki_defconfig
          
          # We are disabling multiple strict checks that are failing:
          # -Wno-error: Disables the "warnings as errors" policy
          # -Wno-int-conversion: Allows the network code to pass argument mismatches
          # -Wno-declaration-after-statement: Handles older C standard styles
          # -Wno-unused-value: Ignores non-returning function errors
          
          export KCFLAGS="-Wno-error -Wno-int-conversion -Wno-declaration-after-statement -Wno-unused-value"
          
          make O=out KCFLAGS="$KCFLAGS" -j1

name: Kernel Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev gcc-aarch64-linux-gnu
      - name: Build Kernel
        run: |
          # 1. Set the architecture and compiler
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 2. Generate the default configuration (using your defconfig)
          make gki_defconfig
          
          # 3. Compile the kernel
          make -j$(nproc)

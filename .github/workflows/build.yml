name: Kernel Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev clang lld llvm

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          
          mkdir -p out
          
          # Clean everything to prevent 'redefinition' ghosts
          make O=out mrproper
          
          # Re-generate config
          make O=out gki_defconfig
          
          # Build sequentially, ignoring warnings, and skipping error stops
          make O=out KCFLAGS="-Wno-error" -j1

name: Kernel Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev
      - name: Build Kernel
        run: |
          # Define standard GKI build environment variables
          export ARCH=arm64
          export SUBARCH=arm64
          # Use the LLVM/Clang variables your Makefile expects
          export LLVM=1
          
          # Create an output directory as required by most Android kernels
          mkdir -p out
          
          # Run the build using the O=out flag
          make O=out gki_defconfig
          make O=out -j$(nproc)

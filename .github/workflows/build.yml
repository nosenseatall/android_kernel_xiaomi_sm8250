name: Kernel Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev clang lld llvm

      - name: Patch Incompatible Code
        run: |
          # 1. Fix arm-smmu-debug.h: Add 'return 0;' to non-void functions
          sed -i '/non-void function/!b;n;s/}/  return 0;\n}/' drivers/iommu/arm-smmu-debug.h
          
          # 2. Fix ip_gre.c: Remove the 4th argument (tunnel_hlen)
          # Note: This is a surgical find-and-replace
          sed -i 's/ip_md_tunnel_xmit(skb, dev, IPPROTO_GRE, tunnel_hlen);/ip_md_tunnel_xmit(skb, dev, IPPROTO_GRE);/g' net/ipv4/ip_gre.c

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          
          mkdir -p out
          make O=out mrproper
          make O=out gki_defconfig
          
          # We keep the flags to be safe, but the patching above does the heavy lifting
          make O=out KCFLAGS="-Wno-error" -j$(nproc)
